name: EAS traceability and conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install reference toolchain
        run: python -m pip install -e .

      - name: Run unit and conformance tests
        run: python -m unittest discover -s tests -v

      - name: Enforce traceability and coverage baseline
        run: >-
          python -m eas_validator.coverage
          --check reports/requirement-coverage.md
          --baseline registry/coverage-baseline.json

      - name: Reproduce controlled two-adapter pilot
        run: >-
          python -m eas_validator.pilot
          --check reports/adapter-pilot.json

      - name: Verify prospective study input lock
        run: >-
          python -m eas_validator.study_lock
          --check research/study-lock-0.1.json

      - name: Execute documented structural validation
        run: eas validate examples/minimal-run.json

      - name: Execute documented behavioral assessment
        run: >-
          eas assess examples/minimal-run.json
          --scenario compliance/scenarios/SCN-001-focused-edit.json
          --artifacts examples/artifacts/SCN-001
          --format json
          --output ${{ runner.temp }}/assessment.json

      - name: Execute documented report rendering
        run: >-
          eas report ${{ runner.temp }}/assessment.json
          --format markdown
          --output ${{ runner.temp }}/assessment.md
